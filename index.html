<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2025 서울 데이트 플래너</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Chosen Palette: Warm Neutrals with Amber Accent -->
    <!-- Application Structure Plan: A user-centric, filter-driven dashboard. The user first defines their desired date 'vibe' and 'budget'. The application then presents matching events (exhibitions/performances) as interactive cards. Clicking a card opens a detailed modal which includes logically linked nearby restaurant recommendations. This structure prioritizes user tasks over the report's linear format, making information discovery intuitive and efficient by connecting activities with dining options in one view. -->
    <!-- Visualization & Content Choices: Report Info (Event prices) -> Goal (Compare costs) -> Viz (Bar Chart) -> Interaction (Hover tooltips) -> Justification (Provides a quick, visual summary of a key decision factor) -> Library (Chart.js/Canvas). Report Info (Event details) -> Goal (Inform/Organize) -> Presentation (Filterable Cards & Detail Modals) -> Interaction (Click to filter, click to view details) -> Justification (Modern, user-friendly SPA pattern for exploration) -> Method (HTML/CSS/JS). -->
    <!-- CONFIRMATION: NO SVG graphics used. NO Mermaid JS used. -->
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #FDFBF8;
            color: #44403c;
        }
        .filter-btn {
            transition: all 0.2s ease-in-out;
        }
        .filter-btn.active {
            background-color: #d97706;
            color: white;
            transform: scale(1.05);
            box-shadow: 0 4px 14px 0 rgb(0 0 0 / 10%);
        }
        .event-card {
            transition: transform 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
        }
        .event-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        .modal-overlay {
            transition: opacity 0.3s ease;
        }
        .modal-content {
            transition: transform 0.3s ease;
        }
        .last-day-tag {
            background: linear-gradient(45deg, #ef4444, #f97316);
        }
        .chart-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
            height: 350px;
            max-height: 50vh;
        }
        @media (min-width: 768px) {
            .chart-container {
                height: 450px;
            }
        }
    </style>
</head>

                        <button data-filter-group="vibe" data-filter="intellectual" class="filter-btn text-sm font-semibold bg-white text-amber-700 py-2 px-4 rounded-full shadow-sm hover:bg-amber-100">?? 지적인 예술 감상</button>
                        <button data-filter-group="vibe" data-filter="unique" class="filter-btn text-sm font-semibold bg-white text-amber-700 py-2 px-4 rounded-full shadow-sm hover:bg-amber-100">?? 이색적인 경험</button>

                </div>
                <div>
                    <h3 class="font-bold text-lg mb-3 text-amber-800">2. 1인당 예산은 얼마인가요?</h3>

                        <button data-filter-group="price" data-filter="50001" class="filter-btn text-sm font-semibold bg-white text-amber-700 py-2 px-4 rounded-full shadow-sm hover:bg-amber-100">5만원 이상</button>
                    </div>
                </div>
                 <div>
                    <h3 class="font-bold text-lg mb-3 text-amber-800">3. 어떤 활동을 찾으세요?</h3>
                    <div id="type-filters" class="flex flex-wrap gap-2">
                        <button data-filter-group="type" data-filter="all" class="filter-btn active text-sm font-semibold bg-white text-amber-700 py-2 px-4 rounded-full shadow-sm hover:bg-amber-100">모두</button>
                        <button data-filter-group="type" data-filter="exhibition" class="filter-btn text-sm font-semibold bg-white text-amber-700 py-2 px-4 rounded-full shadow-sm hover:bg-amber-100">전시회</button>
                        <button data-filter-group="type" data-filter="performance" class="filter-btn text-sm font-semibold bg-white text-amber-700 py-2 px-4 rounded-full shadow-sm hover:bg-amber-100">공연</button>
                    </div>
                </div>
            </div>
        </section>

        <main id="results" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        </main>
        
        <section id="visualization" class="mt-16 bg-white/70 backdrop-blur-sm p-6 rounded-2xl shadow-lg">
            <h2 class="text-2xl font-bold text-center mb-2 text-amber-900">데이트 비용 한눈에 비교하기</h2>
            <p class="text-center text-stone-600 mb-6">각 활동의 1인 기준 기본 입장료를 비교하여 예산 계획에 참고하세요.</p>
            <div class="chart-container">

            </div>
        </section>

    </div>

    <div id="modal" class="modal-overlay fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center p-4 z-50 opacity-0 pointer-events-none">

        </div>

                },
                {

                },
                {

                    { name: "온더보더", menu: "타코, 화이타", vibe: "활기찬 멕시칸", price: "2~5만원대", rating: 4.0 },
                    { name: "샤이바나", menu: "미국 남부 가정식", vibe: "이국적", price: "정보 없음", rating: 0, note: "7/27(일) 휴무로 방문 불가" }
                ],
                mmca: [
                    { name: "진작카키 안국점", menu: "후토마끼, 해산물 요리", vibe: "세련된 일식 다이닝", price: "1인 4.5만원 내외", rating: 4.0 },

                    { name: "고메 오드 삼청동", menu: "생면 파스타", vibe: "모던 & 세련", price: "정보 없음", rating: 4.0 }
                ],

                    { name: "Da Pitta", menu: "화덕피자, 파스타", vibe: "아늑한 이탈리안", price: "2만원대", rating: 4.0 },
                    { name: "백년옥 (별관)", menu: "콩국수, 순두부 (미슐랭)", vibe: "전통 한식", price: "1~2만원대", rating: 4.0 },
                    { name: "카나디안 랍스터", menu: "랍스터 코스 요리", vibe: "고급 & 프라이빗", price: "7~8만원대", rating: 4.0 }
                ]
            }
        };

        const state = {
            vibe: 'all',
            price: 'all',
            type: 'all'
        };

        const resultsContainer = document.getElementById('results');
        const modal = document.getElementById('modal');
        const modalContent = document.getElementById('modal-content');

        function formatPrice(price) {
            if (price < 0) return "정보 없음";
            if (price === 0) return "무료";
            return `${price.toLocaleString()}원`;
        }
        
        function getPriceCategory(price) {
            if (price === 0) return '0';
            if (price > 0 && price <= 20000) return '20000';
            if (price > 20000 && price <= 50000) return '50000';
            if (price > 50000) return '50001';
            return 'all';
        }

        function renderStars(rating) {
            const fullStars = Math.floor(rating);
            const halfStar = rating % 1 !== 0;
            let stars = '?'.repeat(fullStars);
            if (halfStar) stars += '?';
            stars += '☆'.repeat(5 - fullStars - (halfStar ? 1 : 0));
            return `<span class="text-amber-500">${stars}</span> <span class="text-sm text-stone-500 ml-1">(${rating.toFixed(1)})</span>`;
        }
        
        function renderRestaurantCard(restaurant) {
            return `
                <div class="bg-amber-50 rounded-lg p-4 ${restaurant.note ? 'opacity-60' : ''}">
                    <h4 class="font-bold text-amber-800">${restaurant.name}</h4>
                    <p class="text-sm text-stone-600">${restaurant.vibe}</p>
                    <p class="text-sm text-stone-600">?? ${restaurant.menu}</p>
                    <p class="text-sm text-stone-600">?? ${restaurant.price}</p>
                    ${restaurant.note ? `<p class="text-sm font-bold text-red-600 mt-2">?? ${restaurant.note}</p>` : ''}
                </div>
            `;
        }

        function openModal(eventId) {
            const event = data.events.find(e => e.id === eventId);
            const nearbyRestaurants = data.restaurants[event.locationKey] || [];

            modalContent.innerHTML = `
                <div class="p-6 md:p-8">
                    ${event.isLastDay ? '<div class="last-day-tag absolute top-0 right-0 mt-4 -mr-1 text-white text-xs font-bold py-1 px-3 rounded-l-full shadow-lg">마지막 날!</div>' : ''}
                    <h2 class="text-3xl font-bold mb-2 text-amber-900">${event.name}</h2>
                    <div class="flex flex-wrap items-center gap-x-4 gap-y-1 text-sm text-stone-600 mb-4">
                        <span>${renderStars(event.rating)}</span>
                        <span class="font-bold text-amber-700">${formatPrice(event.price)}</span>
                        <span>?? ${event.location}</span>
                        <span>?? ${event.time}</span>
                        <span>?? ${event.age}</span>
                    </div>
                    <p class="mb-4">${event.description}</p>
                    <div class="bg-amber-100/50 p-4 rounded-lg text-sm">
                        <h4 class="font-bold mb-1 text-amber-800">알아두면 좋은 점</h4>
                        <p>${event.details}</p>
                    </div>

                    ${nearbyRestaurants.length > 0 ? `
                    <div class="mt-6">
                        <h3 class="text-xl font-bold mb-3 text-amber-900">주변 추천 맛집</h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                            ${nearbyRestaurants.map(renderRestaurantCard).join('')}
                        </div>
                    </div>
                    ` : ''}
                </div>
                <button id="closeModal" class="absolute top-0 right-0 mt-4 mr-4 text-stone-500 hover:text-stone-800 text-2xl">&times;</button>
            `;

            modal.classList.remove('opacity-0', 'pointer-events-none');
            modalContent.classList.remove('scale-95');

            document.getElementById('closeModal').addEventListener('click', closeModal);
        }

        function closeModal() {
            modal.classList.add('opacity-0', 'pointer-events-none');
            modalContent.classList.add('scale-95');
        }
        
        function renderCards() {
            resultsContainer.innerHTML = '';
            
            const filteredEvents = data.events.filter(event => {
                const vibeMatch = state.vibe === 'all' || event.vibes.includes(state.vibe);
                const priceMatch = state.price === 'all' || getPriceCategory(event.price) === state.price;
                const typeMatch = state.type === 'all' || event.type === state.type;
                return vibeMatch && priceMatch && typeMatch;
            });

            if (filteredEvents.length === 0) {
                resultsContainer.innerHTML = `<div class="col-span-1 md:col-span-2 lg:col-span-3 text-center py-12 bg-white rounded-lg shadow-md">
                    <p class="text-xl text-stone-600">아쉽지만, 조건에 맞는 활동이 없어요. ??</p>
                    <p class="text-stone-500 mt-2">필터를 조정해서 다시 찾아보세요!</p>
                </div>`;
                return;
            }

            filteredEvents.forEach(event => {
                const card = document.createElement('div');
                card.className = 'event-card bg-white rounded-2xl shadow-lg overflow-hidden cursor-pointer flex flex-col';
                card.dataset.eventId = event.id;
                
                let priceDisplay = formatPrice(event.price);
                let typeDisplay = event.type === 'exhibition' ? '전시회' : '공연';
                let typeColor = event.type === 'exhibition' ? 'bg-rose-100 text-rose-800' : 'bg-sky-100 text-sky-800';

                card.innerHTML = `
                    <div class="p-6 flex-grow">
                        ${event.isLastDay ? '<div class="last-day-tag absolute top-0 right-0 mt-4 -mr-1 text-white text-xs font-bold py-1 px-3 rounded-l-full shadow-lg">마지막 날!</div>' : ''}
                        <div class="flex justify-between items-start mb-2">
                             <span class="text-xs font-semibold ${typeColor} py-1 px-2 rounded-full">${typeDisplay}</span>
                             <div class="text-right">${renderStars(event.rating)}</div>
                        </div>
                        <h3 class="text-xl font-bold text-amber-900 mb-2">${event.name}</h3>
                        <p class="text-sm text-stone-600 line-clamp-2 flex-grow">${event.description}</p>
                    </div>
                    <div class="bg-amber-100/50 px-6 py-3 flex justify-between items-center text-sm font-semibold">
                        <span class="text-amber-800">?? ${event.location}</span>
                        <span class="text-amber-700">${priceDisplay}</span>
                    </div>
                `;
                card.addEventListener('click', () => openModal(event.id));
                resultsContainer.appendChild(card);
            });
        }

        function handleFilterClick(e) {
            if (e.target.tagName !== 'BUTTON') return;

            const group = e.target.dataset.filterGroup;
            const value = e.target.dataset.filter;

            state[group] = value;

            document.querySelectorAll(`#${group}-filters button`).forEach(btn => {
                btn.classList.remove('active');
            });
            e.target.classList.add('active');

            renderCards();
        }
        
        function createPriceChart() {
            const ctx = document.getElementById('priceChart').getContext('2d');
            const chartData = data.events.filter(e => e.price >= 0);
            
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: chartData.map(e => e.name),
                    datasets: [{
                        label: '1인 입장료 (원)',
                        data: chartData.map(e => e.price),
                        backgroundColor: 'rgba(217, 119, 6, 0.6)',
                        borderColor: 'rgba(217, 119, 6, 1)',
                        borderWidth: 1,
                        borderRadius: 5,
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    indexAxis: 'y',
                    scales: {
                        x: {
                            beginAtZero: true,
                            ticks: {
                                callback: function(value, index, values) {
                                    return value.toLocaleString() + '원';
                                }
                            }
                        },
                        y: {
                           ticks: {
                                autoSkip: false,
                                font: {
                                    size: 10
                                }
                           }
                        }
                    },
                    plugins: {
                        legend: {
                            display: false
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    let label = context.dataset.label || '';
                                    if (label) {
                                        label += ': ';
                                    }
                                    if (context.parsed.x !== null) {
                                        label += context.parsed.x.toLocaleString() + '원';
                                    }
                                    return label;
                                }
                            }
                        }
                    }
                }
            });
        }

        document.getElementById('vibe-filters').addEventListener('click', handleFilterClick);
        document.getElementById('price-filters').addEventListener('click', handleFilterClick);
        document.getElementById('type-filters').addEventListener('click', handleFilterClick);
        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                closeModal();
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            renderCards();
            createPriceChart();
        });
    </script>
</body>
</html>
